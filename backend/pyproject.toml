[project]
name = "archive-rag-backend"
version = "0.1.0"
description = "A document archive agent with hybrid RAG over ChromaDB and BM25."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "chromadb>=1.0,<2",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    "bm25s>=0.2.6",
    "pypdf>=5.0",
    "openai>=1.90,<2",
    "tqdm>=4.66",
    "trafilatura>=2.3.1",
    "ddgs>=9.16.0",
    "python-multipart>=0.0.32",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
